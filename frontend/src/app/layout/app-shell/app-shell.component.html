<header class="topbar">
    <a class="logo" routerLink="/inicio">
        <span>TI</span> Helpdesk TI
    </a>

    <nav aria-label="Navegación principal">
        <a routerLink="/inicio" routerLinkActive="active">
            Inicio
        </a>

        <a routerLink="/tickets" routerLinkActive="active">
            Tickets
        </a> @if (user()?.rol === 'ADMINISTRATOR') {
        <a routerLink="/administracion/usuarios" routerLinkActive="active">
            Usuarios
        </a>

        <a routerLink="/administracion/categorias" routerLinkActive="active">
            Categorías
        </a>
        <a routerLink="/administracion/metricas" routerLinkActive="active">
            Métricas
        </a>}
    </nav>

    <div class="user-area">
        <div>
            <strong> {{ user()?.nombreCompleto }}</strong>
            <small>{{ user()?.correo }}</small>
        </div>

        <button class="logout-button" type="button" [disabled]="closingSession()" (click)="logout()"> {{ closingSession() ? 'Saliendo...' : 'Cerrar sesión' }}</button>
    </div>
</header>

<main class="app-content">
    <router-outlet/>
</main>
